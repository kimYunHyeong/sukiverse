<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0" />
  <title>Sukiverse - 애니메이션 목록 (Wireframe)</title>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111111;
      --surface: #1e1e1e;
      --surface2: #2a2a2a;
      --border: #333333;
      --text-primary: #ffffff;
      --text-secondary: #888888;
      --text-muted: #555555;
      --primary: #f5c400;
      --primary-muted: #3a3000;
      --radius: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Arial', sans-serif;
      width: 375px;
      min-height: 100vh;
    }

    /* GNB */
    .gnb {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(17, 17, 17, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .gnb-logo {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .gnb-nav {
      display: flex;
      gap: 16px;
    }
    .gnb-nav a {
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
    }
    .gnb-nav a.active {
      color: var(--primary);
      font-weight: 700;
    }
    .gnb-profile {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    /* 페이지 헤더 */
    .page-header {
      padding: 20px 16px 12px;
    }
    .page-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 14px;
    }

    /* 검색바 */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 12px;
      height: 40px;
      margin-bottom: 16px;
    }
    .search-icon {
      width: 16px;
      height: 16px;
      background: var(--text-muted);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .search-placeholder {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* 필터 영역 */
    .filter-section {
      padding: 0 16px 12px;
    }

    /* 정렬 탭 */
    .sort-tabs {
      display: flex;
      gap: 0;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 3px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .sort-tab {
      flex: 1;
      text-align: center;
      padding: 7px 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: 6px;
    }
    .sort-tab.active {
      background: var(--primary);
      color: #111;
    }

    /* 장르 필터 */
    .filter-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .genre-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .genre-pills::-webkit-scrollbar { display: none; }
    .pill {
      flex-shrink: 0;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      background: transparent;
      white-space: nowrap;
    }
    .pill.active {
      background: var(--primary-muted);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* 결과 카운트 */
    .result-count {
      padding: 8px 16px 12px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .result-count span {
      color: var(--text-secondary);
      font-weight: 600;
    }

    /* 카드 그리드 */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 16px 80px;
    }

    .anime-card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .card-poster {
      width: 100%;
      aspect-ratio: 3/4;
      background: var(--surface2);
      position: relative;
      display: flex;
      align-items: flex-end;
    }
    .card-poster-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2a2a2a 0%, #1e1e1e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .poster-icon {
      width: 32px;
      height: 32px;
      background: var(--border);
      border-radius: 4px;
    }
    .card-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--primary);
      color: #111;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .card-body {
      padding: 8px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      line-height: 1.3;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .card-genre {
      font-size: 10px;
      color: var(--text-muted);
    }
    .card-dot {
      width: 2px;
      height: 2px;
      background: var(--text-muted);
      border-radius: 50%;
    }
    .card-rating {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      color: var(--primary);
      font-weight: 700;
    }
    .star {
      width: 8px;
      height: 8px;
      background: var(--primary);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }

    /* 더보기 버튼 */
    .load-more {
      margin: 0 16px 32px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--surface);
    }

    /* 바텀 네비 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 375px;
      background: rgba(17,17,17,0.95);
      border-top: 1px solid var(--border);
      display: flex;
      height: 58px;
    }
    .bottom-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .nav-icon {
      width: 20px;
      height: 20px;
      background: var(--text-muted);
      border-radius: 4px;
    }
    .nav-icon.active {
      background: var(--primary);
    }
    .nav-label {
      font-size: 10px;
      color: var(--text-muted);
    }
    .nav-label.active {
      color: var(--primary);
    }

    /* 어노테이션 */
    .annotation {
      position: absolute;
      background: rgba(245, 196, 0, 0.15);
      border: 1.5px dashed var(--primary);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      color: var(--primary);
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- GNB -->
  <nav class="gnb">
    <div class="gnb-logo">sukiverse</div>
    <div class="gnb-nav">
      <a href="#" class="active">애니</a>
      <a href="#">J-POP</a>
    </div>
    <div class="gnb-profile"></div>
  </nav>

  <!-- 페이지 헤더 -->
  <div class="page-header">
    <div class="page-title">애니메이션</div>

    <!-- 검색바 -->
    <div class="search-bar">
      <div class="search-icon"></div>
      <span class="search-placeholder">애니메이션 검색...</span>
    </div>
  </div>

  <!-- 필터 섹션 -->
  <div class="filter-section">

      <div class="sort-tab active">인기순</div>

    <!-- 장르 필터 -->
    <div class="filter-label">장르</div>
    <div class="genre-pills">

      <div class="pill">액션</div>
      <div class="pill">로맨스</div>
      <div class="pill">판타지</div>
      <div class="pill">SF</div>
      <div class="pill">일상</div>
      <div class="pill">스포츠</div>

  </div>

  <!-- 결과 카운트 -->
  <div class="result-count">총 <span>248</span>개의 애니메이션</div>

  <!-- 카드 그리드 -->
  <div class="card-grid">

    <!-- 카드 1 -->
    <div class="anime-card">
      <div class="card-poster">

        </div>
      </div>
    </div>

    <!-- 카드 2 -->
    <div class="anime-card">
      <div class="card-poster">
        <div class="card-poster-placeholder"><div class="poster-icon"></div></div>
        <div class="card-badge">2위</div>
      </div>
      <div class="card-body">
        <div class="card-title">주술회전</div>
        <div class="card-meta">
          <span class="card-genre">액션</span>
          <div class="card-dot"></div>
          <div class="card-rating"><div class="star"></div> 8.9</div>
        </div>
      </div>
    </div>

    <!-- 카드 3 -->
    <div class="anime-card">
      <div class="card-poster">
        <div class="card-poster-placeholder"><div class="poster-icon"></div></div>
        <div class="card-badge">3위</div>
      </div>
      <div class="card-body">
        <div class="card-title">스파이 패밀리</div>
        <div class="card-meta">
          <span class="card-genre">일상</span>
          <div class="card-dot"></div>
          <div class="card-rating"><div class="star"></div> 8.7</div>
        </div>
      </div>
    </div>

    <!-- 카드 4 -->
    <div class="anime-card">
      <div class="card-poster">
        <div class="card-poster-placeholder"><div class="poster-icon"></div></div>
        <div class="card-badge">4위</div>
      </div>
      <div class="card-body">
        <div class="card-title">원피스</div>
        <div class="card-meta">
          <span class="card-genre">액션</span>
          <div class="card-dot"></div>
          <div class="card-rating"><div class="star"></div> 9.0</div>
        </div>
      </div>
    </div>

    <!-- 카드 5 -->
    <div class="anime-card">
      <div class="card-poster">
        <div class="card-poster-placeholder"><div class="poster-icon"></div></div>
      </div>
      <div class="card-body">
        <div class="card-title">나의 히어로 아카데미아</div>
        <div class="card-meta">
          <span class="card-genre">액션</span>
          <div class="card-dot"></div>
          <div class="card-rating"><div class="star"></div> 8.5</div>
        </div>
      </div>
    </div>

    <!-- 카드 6 -->
    <div class="anime-card">
      <div class="card-poster">
        <div class="card-poster-placeholder"><div class="poster-icon"></div></div>
      </div>
      <div class="card-body">
        <div class="card-title">진격의 거인 파이널</div>
        <div class="card-meta">
          <span class="card-genre">액션</span>
          <div class="card-dot"></div>

  </div>

  <!-- 더보기 -->

  <!-- 바텀 네비 -->

      <div class="nav-icon"></div>

    <div class="bottom-nav-item">
      <div class="nav-icon active"></div>
      <div class="nav-label active">애니</div>
    </div>
    <div class="bottom-nav-item">

    <div class="bottom-nav-item">

</body>
</html>
