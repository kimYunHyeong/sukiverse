<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 텍스트가 따라갈 아치 경로 (지구본 곡선) -->
    <path id="textArc" d="M 70,208 A 240,240 0 0,0 330,208"/>
  </defs>

  <!-- 배경 -->
  <rect width="400" height="400" fill="#0d0d0d"/>

  <!-- 달 -->
  <circle cx="200" cy="200" r="178" fill="#fde68a"/>

  <!-- ✦ 스파클 -->
  <polygon points="358,38 361,48 371,51 361,54 358,64 355,54 345,51 355,48" fill="#fbcfe8"/>

  <!-- sukiverse 텍스트 (아치형) -->
  <text
    font-family="'Fredoka One', 'Nunito', 'Varela Round', sans-serif"
    font-size="52"
    font-weight="800"
    letter-spacing="2"
    paint-order="stroke fill"
    stroke="#0d0d0d"
    stroke-width="3"
    stroke-linejoin="round"
    fill="#0d0d0d"
  >
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      sukiverse
    </textPath>
  </text>

</svg>
